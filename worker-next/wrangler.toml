name = "flightcard-worker"
main = "src/index.ts"

compatibility_date = "2024-12-18"

[observability]
enabled = true

[vars]
CLOUDFLARE_API_TOKEN = "not used in dev"
CLOUDFLARE_ACCOUNT_ID = "not used in dev"

[[durable_objects.bindings]]
name = "FC_LAUNCH_DO"
class_name = "LaunchDO"

[[migrations]]
tag = "v1"
new_classes = ["LaunchDO"]

[triggers]
# Frequency here determines how often NAR logic can fetch a page of results.
# crons = ["0 1 * * *"] # daily @ 1am
crons = ["*/10 * * * *"] # every 10 minutes

[[d1_databases]]
binding = "AppDB"
database_name = "flightcard"
database_id = "264af65f-b0cc-49d9-8118-7892cb52fa06"
migrations_table = "migrations"

# Note: Be sure to update bindings in .envrc
[[kv_namespaces]]
binding = "CertsKV"
id = "afad0f09ca4e41e79ce14272da78ad04"
preview_id = "202f9cc828c149d0acfc1238195eeeff"

[dev]
port = 1235
